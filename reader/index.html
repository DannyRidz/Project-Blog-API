<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>
  </head>
  <body>
    <header>
      <h1>My Blog</h1>
      <p>Posts and conversations</p>
    </header>

    <main>
      <section aria-labelledby="posts-heading">
        <h2 id="posts-heading">Posts</h2>
        <p id="post-status" role="status">Loading posts...</p>
        <div id="post-list"></div>
      </section>

      <article id="post-detail" hidden>
        <h2 id="post-title"></h2>
        <p id="post-meta"></p>
        <div id="post-content"></div>

        <h3>Comments</h3>
        <ul id="comments-list"></ul>

        <h3>Leave a comment</h3>
        <form id="comment-form">
          <label for="author-name">Your name</label>
          <input id="author-name" name="authorName" required maxlength="80" />

          <label for="comment-content">Comment</label>
          <textarea
            id="comment-content"
            name="content"
            required
            rows="4"
          ></textarea>

          <button type="submit">Post comment</button>
        </form>
        <p id="comment-status" role="status"></p>
      </article>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
